name: Build

# Kontrola, že se web dá sestavit (u každého PR a pushe)
on:
  pull_request:
  push:
    branches-ignore: [forpsi-web]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          BASE: /bourak/
